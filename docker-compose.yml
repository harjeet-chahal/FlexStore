# FlexStore development cluster.
#
#   1 gateway, 1 coordinator, 5 storage nodes, PostgreSQL, Redis,
#   Prometheus, Grafana.
#
# All five storage nodes run the SAME image with different configuration and
# their own volume -- that is the point of the exercise, and it is also how a
# real deployment would look.

name: flexstore

# Shared by all five storage nodes. Note there is no `build:` here: Compose
# cannot build the same image tag from five services concurrently (they race on
# the export step), so storage-node-1 owns the build and the other four just
# reference the resulting image.
x-storage-node: &storage-node
  image: flexstore/storage-node:dev
  restart: unless-stopped
  depends_on:
    coordinator:
      condition: service_healthy
  environment: &storage-node-env
    FLEXSTORE_GRPC_ADDR: "0.0.0.0:9100"
    FLEXSTORE_METRICS_ADDR: "0.0.0.0:9103"
    FLEXSTORE_DATA_DIR: "/data"
    FLEXSTORE_COORDINATOR_ADDR: "coordinator:9090"
    FLEXSTORE_HEARTBEAT_INTERVAL: "${FLEXSTORE_HEARTBEAT_INTERVAL:-5s}"
    # Each node advertises a modest quota rather than the shared host disk, so
    # capacity-aware placement has something meaningful to balance across.
    FLEXSTORE_NODE_CAPACITY_BYTES: "${FLEXSTORE_NODE_CAPACITY_BYTES:-10GiB}"
    FLEXSTORE_LOG_LEVEL: "${FLEXSTORE_LOG_LEVEL:-info}"
    FLEXSTORE_LOG_FORMAT: "${FLEXSTORE_LOG_FORMAT:-json}"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9103/readyz"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-flexstore}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-flexstore}"
      POSTGRES_DB: "${POSTGRES_DB:-flexstore}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback-only. These are debugging conveniences, not services: a
      # 0.0.0.0 bind puts an unauthenticated-by-default datastore on every
      # interface the host has, including a coffee-shop Wi-Fi network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flexstore} -d ${POSTGRES_DB:-flexstore}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: Redis holds only caches and short-lived locks here, and
    # pretending otherwise would blur the durability story.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  coordinator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: coordinator
    image: flexstore/coordinator:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLEXSTORE_GRPC_ADDR: "0.0.0.0:9090"
      FLEXSTORE_METRICS_ADDR: "0.0.0.0:9102"
      FLEXSTORE_POSTGRES_DSN: "postgres://${POSTGRES_USER:-flexstore}:${POSTGRES_PASSWORD:-flexstore}@postgres:5432/${POSTGRES_DB:-flexstore}?sslmode=disable"
      FLEXSTORE_REDIS_ADDR: "redis:6379"
      FLEXSTORE_REPLICATION_FACTOR: "${FLEXSTORE_REPLICATION_FACTOR:-3}"
      FLEXSTORE_MIN_WRITE_REPLICAS: "${FLEXSTORE_MIN_WRITE_REPLICAS:-2}"
      FLEXSTORE_CHUNK_SIZE: "${FLEXSTORE_CHUNK_SIZE:-8MiB}"
      FLEXSTORE_HEARTBEAT_INTERVAL: "${FLEXSTORE_HEARTBEAT_INTERVAL:-5s}"
      FLEXSTORE_SUSPECT_TIMEOUT: "${FLEXSTORE_SUSPECT_TIMEOUT:-15s}"
      FLEXSTORE_DEAD_TIMEOUT: "${FLEXSTORE_DEAD_TIMEOUT:-45s}"
      FLEXSTORE_GC_INTERVAL: "${FLEXSTORE_GC_INTERVAL:-20s}"
      FLEXSTORE_PLACEMENT_STRATEGY: "${FLEXSTORE_PLACEMENT_STRATEGY:-weighted}"
      FLEXSTORE_REPAIR_ENABLED: "${FLEXSTORE_REPAIR_ENABLED:-true}"
      FLEXSTORE_REPAIR_WORKERS: "${FLEXSTORE_REPAIR_WORKERS:-4}"
      FLEXSTORE_REPAIR_MAX_PER_NODE: "${FLEXSTORE_REPAIR_MAX_PER_NODE:-2}"
      FLEXSTORE_REPAIR_SCAN_INTERVAL: "${FLEXSTORE_REPAIR_SCAN_INTERVAL:-5s}"
      FLEXSTORE_RECONCILE_ENABLED: "${FLEXSTORE_RECONCILE_ENABLED:-true}"
      FLEXSTORE_RECONCILE_INTERVAL: "${FLEXSTORE_RECONCILE_INTERVAL:-5s}"
      FLEXSTORE_RECONCILE_VERIFY_CHECKSUMS: "${FLEXSTORE_RECONCILE_VERIFY_CHECKSUMS:-true}"
      FLEXSTORE_LOG_LEVEL: "${FLEXSTORE_LOG_LEVEL:-info}"
      FLEXSTORE_LOG_FORMAT: "${FLEXSTORE_LOG_FORMAT:-json}"
    ports:
      # The coordinator gRPC port has no authentication: anything that can
      # reach it can register itself as a storage node. Loopback only.
      - "127.0.0.1:${COORDINATOR_GRPC_PORT:-9090}:9090"
      - "127.0.0.1:${COORDINATOR_METRICS_PORT:-9102}:9102"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9102/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: gateway
    image: flexstore/gateway:dev
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      FLEXSTORE_HTTP_ADDR: "0.0.0.0:8080"
      FLEXSTORE_METRICS_ADDR: "0.0.0.0:9101"
      FLEXSTORE_COORDINATOR_ADDR: "coordinator:9090"
      FLEXSTORE_CHUNK_SIZE: "${FLEXSTORE_CHUNK_SIZE:-8MiB}"
      FLEXSTORE_LOG_LEVEL: "${FLEXSTORE_LOG_LEVEL:-info}"
      FLEXSTORE_LOG_FORMAT: "${FLEXSTORE_LOG_FORMAT:-json}"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "127.0.0.1:${GATEWAY_METRICS_PORT:-9101}:9101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # storage-node-1 owns the build of the shared storage-node image; nodes 2-5
  # reuse it. All five run the identical binary with different configuration.
  storage-node-1:
    <<: *storage-node
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: storage-node
    environment:
      <<: *storage-node-env
      FLEXSTORE_NODE_ID: "storage-node-1"
      FLEXSTORE_ADVERTISE_ADDR: "storage-node-1:9100"
    volumes:
      - storage-node-1-data:/data

  storage-node-2:
    <<: *storage-node
    environment:
      <<: *storage-node-env
      FLEXSTORE_NODE_ID: "storage-node-2"
      FLEXSTORE_ADVERTISE_ADDR: "storage-node-2:9100"
    volumes:
      - storage-node-2-data:/data

  storage-node-3:
    <<: *storage-node
    environment:
      <<: *storage-node-env
      FLEXSTORE_NODE_ID: "storage-node-3"
      FLEXSTORE_ADVERTISE_ADDR: "storage-node-3:9100"
    volumes:
      - storage-node-3-data:/data

  storage-node-4:
    <<: *storage-node
    environment:
      <<: *storage-node-env
      FLEXSTORE_NODE_ID: "storage-node-4"
      FLEXSTORE_ADVERTISE_ADDR: "storage-node-4:9100"
    volumes:
      - storage-node-4-data:/data

  storage-node-5:
    <<: *storage-node
    environment:
      <<: *storage-node-env
      FLEXSTORE_NODE_ID: "storage-node-5"
      FLEXSTORE_ADVERTISE_ADDR: "storage-node-5:9100"
    volumes:
      - storage-node-5-data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # 9091, not 9090: the coordinator's gRPC port already claims 9090.
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous viewing is opt-in rather than on by default. It is genuinely
      # convenient for a local demo -- open localhost:3000 and the dashboards are
      # just there -- but "convenient for a demo" and "safe by default" point in
      # opposite directions, and the default has to be the safe one.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_COOKIE_SECURE: "${GRAFANA_COOKIE_SECURE:-false}"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
  storage-node-4-data:
  storage-node-5-data:
