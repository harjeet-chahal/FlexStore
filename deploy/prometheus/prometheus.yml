# Prometheus scrape configuration for the FlexStore compose cluster.
#
# Every FlexStore binary serves /metrics on its private admin port; targets
# here use the compose-network service names, so this file needs no changes
# when host port mappings do.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9101"]

  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:9102"]

  - job_name: storage-node
    static_configs:
      - targets:
          - "storage-node-1:9103"
          - "storage-node-2:9103"
          - "storage-node-3:9103"
          - "storage-node-4:9103"
          - "storage-node-5:9103"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
